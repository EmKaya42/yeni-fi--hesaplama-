# Nixpacks configuration for Railway
[phases.setup]
nixPkgs = ["python311", "tesseract", "glib"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements-railway.txt"
]

[variables]
PATH = "/opt/venv/bin:"

[start]
cmd = "/opt/venv/bin/gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60"
